# lahn for macOS (13.3 and later: decimals written with std::to_chars), built on one of GitHub's Macs: one program for
# Apple Silicon and Intel together, packed with its
# resources, a file to start it with and how to, as a zip to download from the run's page (Artifacts). Then the tests,
# built and run on the Mac too, so anything that behaves differently there shows.
name: macOS build

on:
  push:
    branches: [main]
  workflow_dispatch: # by hand, from the Actions tab

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3

      - name: Build lahn
        run: cmake --build build --target lahn -j 4 -- -k # -k: every error at once, not just the first

      - name: Pack it
        run: |
          mkdir -p package/lahn
          cp build/lahn package/lahn/
          cp -R build/resources package/lahn/
          cp packaging/macos/"Start lahn.command" packaging/macos/README.txt package/lahn/
          chmod +x package/lahn/lahn package/lahn/"Start lahn.command"
          lipo -info package/lahn/lahn
          # ditto keeps what makes the program and the start file runnable, which plain zip may lose
          ditto -c -k --keepParent package/lahn lahn-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lahn-macos
          path: lahn-macos.zip
          retention-days: 30

      - name: Build the tests
        run: cmake --build build --target lahn_tests -j 4

      - name: Run the tests
        run: ./build/lahn_tests
